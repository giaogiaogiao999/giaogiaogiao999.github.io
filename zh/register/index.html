<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册普通用户 | LUMOSY Aluminum</title><meta name="description" content="LUMOSY customer and administrator portal"><link rel="icon" href="/wp-content/uploads/2026/10/logo.png"><link rel="stylesheet" href="/auth-system.css"></head><body data-page="register"><header class="auth-header"><a class="auth-brand" href="/zh/"><img src="/wp-content/uploads/2026/10/logo.png" alt="LUMOSY"><span>LUMOSY ALUMINUM</span></a><nav class="auth-nav"><a href="/zh/">首页</a><a href="/zh/products/">产品</a><a href="/login/">English</a><a class="auth-home" href="/zh/contact-us/">CONTACT US</a></nav></header><main class="auth-shell"><section class="auth-visual"><h1>专业铝型材制造商</h1><p>安全管理产品选择、询价进度与客户服务。</p></section><section class="auth-panel"><div class="auth-card"><div class="auth-kicker">普通用户注册</div><h2>注册普通用户</h2><p class="auth-lead">注册入口只创建普通用户。管理员账号必须由已登录管理员手动添加。</p><div class="auth-notice" data-notice></div><form class="auth-form" data-register-form data-register-method="email"><div class="auth-method-toggle" role="group" aria-label="Registration method"><button class="is-active" type="button" data-register-method="email">普通邮箱注册</button><button type="button" data-register-method="qq">QQ邮箱注册</button></div><div class="auth-fields-2"><div class="auth-field"><label for="name">姓名</label><input id="name" name="name" autocomplete="name" required></div><div class="auth-field"><label for="company">公司</label><input id="company" name="company" autocomplete="organization"></div></div><div class="auth-fields-2"><div class="auth-field"><label for="email" data-email-label data-email-label-default="邮箱" data-email-label-qq="QQ号">邮箱</label><div class="auth-email-control"><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required data-register-email data-email-placeholder="name@example.com" data-qq-placeholder="123456789"><span data-qq-suffix>@qq.com</span></div><small class="auth-field-help" data-qq-help>系统会自动注册为 QQ号@qq.com，登录时请输入完整QQ邮箱。</small></div><div class="auth-field"><label for="phone">电话 / WhatsApp</label><input id="phone" name="phone" autocomplete="tel"></div></div><div class="auth-fields-2"><div class="auth-field"><label for="password">密码</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="auth-field"><label for="confirmPassword">确认密码</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div></div><label class="auth-check"><input type="checkbox" required><span>我同意账号与隐私条款。</span></label><button class="auth-submit" type="submit">注册普通用户</button></form><p class="auth-switch">已有账号？ <a href="/zh/login/">登录</a></p></div></section></main><script src="/auth-system.js"></script></body></html>
