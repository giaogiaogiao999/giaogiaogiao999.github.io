<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 | LUMOSY Aluminum</title><meta name="description" content="LUMOSY customer and administrator portal"><link rel="icon" href="/wp-content/uploads/2026/10/logo.png"><link rel="stylesheet" href="/auth-system.css"></head><body class="portal-body" data-page="admin"><div class="portal-layout"><aside class="portal-sidebar"><a class="auth-brand" href="/zh/"><img src="/wp-content/uploads/2026/10/logo.png" alt="LUMOSY"><span>LUMOSY</span></a><div class="portal-role">管理后台</div><nav class="portal-menu"><a class="is-active" href="/zh/admin/">仪表盘</a><a href="/zh/products/">产品</a><a href="/zh/">返回官网</a><button type="button" data-logout>退出登录</button></nav></aside><main class="portal-main"><div class="portal-top"><h1>管理后台</h1><div class="portal-user">欢迎, <strong data-user-name></strong></div></div><div class="auth-notice" data-notice></div><section class="portal-stats portal-stats--four"><article class="stat-card"><span>注册用户</span><strong data-stat-users>0</strong></article><article class="stat-card"><span>管理员</span><strong data-stat-admins>0</strong></article><article class="stat-card"><span>上架产品</span><strong data-stat-products>0</strong></article><article class="stat-card"><span>询价数</span><strong data-stat-inquiries>0</strong></article></section><div class="portal-grid"><div><section class="portal-card"><h2>产品管理</h2><table class="portal-table"><thead><tr><th></th><th>英文产品名称</th><th>英文分类</th><th>状态</th><th>操作</th></tr></thead><tbody data-products-table></tbody></table></section><section class="portal-card"><h2>询价记录</h2><table class="portal-table"><thead><tr><th>编号</th><th>客户</th><th>产品数</th><th>状态</th></tr></thead><tbody data-inquiries-table></tbody></table></section><section class="portal-card"><h2>账号管理</h2><table class="portal-table"><thead><tr><th>姓名</th><th>角色</th><th>公司</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead><tbody data-users-table></tbody></table></section></div><aside><section class="portal-card"><h2>新增或编辑产品</h2><form class="auth-form" data-product-form><input name="id" type="hidden"><div class="auth-field"><label>英文产品名称</label><input name="title" required></div><div class="auth-field"><label>中文产品名称</label><input name="titleZh"></div><div class="auth-fields-2"><div class="auth-field"><label>英文分类</label><input name="category" required></div><div class="auth-field"><label>中文分类</label><input name="categoryZh"></div></div><div class="auth-field"><label>图片地址</label><input name="image" placeholder="/wp-content/uploads/..."></div><div class="auth-field"><label>状态</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><button class="auth-submit" type="submit">保存产品</button></form></section><section class="portal-card"><h2>新增管理员</h2><p class="auth-lead">管理员账号只能由已登录管理员在此手动创建。</p><form class="auth-form" data-admin-form><div class="auth-field"><label>姓名</label><input name="name" required></div><div class="auth-field"><label>邮箱</label><input name="email" type="email" required></div><div class="auth-field"><label>密码</label><input name="password" type="password" minlength="8" required></div><button class="auth-submit" type="submit">创建管理员</button></form></section></aside></div></main></div><script src="/auth-system.js"></script></body></html>
